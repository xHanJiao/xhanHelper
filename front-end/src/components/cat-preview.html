<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素小猫预览</title>
<style>
  body {
    margin: 0; padding: 60px;
    background: #1a1a2e;
    font-family: sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 40px;
  }
  .preview-row { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
  .preview-item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .preview-label { color: #aaa; font-size: 12px; }
  .bubble {
    background: #2a2a3e;
    border-radius: 12px 12px 12px 4px;
    padding: 22px 26px;
    min-width: 72px; min-height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .bubble-text { color: #e0e0e0; font-size: 14px; }

  .cat-svg { animation: cat-bounce 0.4s ease-in-out infinite; }
  @keyframes cat-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .legs-front, .legs-back { animation: leg-run 0.4s ease-in-out infinite; }
  .legs-back { animation-delay: 0.2s; }
  @keyframes leg-run {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1px); }
  }
  .tail-run { transform-origin: 6px 48px; animation: tail-wag 0.4s ease-in-out infinite; }
  @keyframes tail-wag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-8deg); }
  }
  .blink { animation: blink 3s ease-in-out infinite; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 1; }
    85%, 95% { opacity: 0; }
  }
</style>
</head>
<body>

<h2 style="color:#ccc; font-weight:400;">像素小猫 — 大头侧身跑</h2>

<div class="preview-row">

  <div class="preview-item">
    <div class="preview-label">实际大小（84×60px）</div>
    <div class="bubble">

<svg class="cat-svg" width="84" height="60" viewBox="0 -1 14 10" xmlns="http://www.w3.org/2000/svg">
  <!-- 身体 -->
  <rect x="2" y="3" width="5" height="1" fill="#d4a574"/>
  <rect x="2" y="4" width="5" height="1" fill="#d4a574"/>
  <rect x="2" y="5" width="5" height="1" fill="#d4a574"/>

  <!-- 后腿 -->
  <g class="legs-back">
    <rect x="3" y="6" width="1" height="1" fill="#c4946a"/>
    <rect x="4" y="6" width="1" height="1" fill="#c4946a"/>
  </g>

  <!-- 前腿 -->
  <g class="legs-front">
    <rect x="6" y="6" width="1" height="1" fill="#c4946a"/>
    <rect x="7" y="6" width="1" height="1" fill="#c4946a"/>
  </g>

  <!-- 头 (5列×4行 = 大头!) -->
  <rect x="5"  y="0" width="2" height="1" fill="#d4a574"/>
  <rect x="4"  y="1" width="4" height="1" fill="#d4a574"/>
  <rect x="3"  y="2" width="6" height="1" fill="#d4a574"/>
  <rect x="4"  y="3" width="5" height="1" fill="#d4a574"/>

  <!-- 双耳 -->
  <rect x="5" y="-1" width="1" height="1" fill="#d4875e"/>
  <rect x="7" y="-1" width="1" height="1" fill="#d4875e"/>
  <rect x="4" y="0"  width="1" height="1" fill="#d4875e"/>
  <rect x="8" y="0"  width="1" height="1" fill="#d4875e"/>

  <!-- 内耳 -->
  <rect x="5" y="0" width="1" height="1" fill="#e8b090"/>
  <rect x="7" y="0" width="1" height="1" fill="#e8b090"/>

  <!-- 双眼 -->
  <g class="blink">
    <rect x="5" y="2" width="1" height="1" fill="#333"/>
    <rect x="7" y="2" width="1" height="1" fill="#333"/>
  </g>

  <!-- 鼻子 -->
  <rect x="6" y="3" width="1" height="1" fill="#e8917e"/>
</svg>

    </div>
  </div>

  <div class="preview-item">
    <div class="preview-label">收到文字后消失</div>
    <div class="bubble">
      <div class="bubble-text">查到 12 笔账单…</div>
    </div>
  </div>

</div>

<p style="color:#666;font-size:12px;margin-top:32px;">
  SVG像素风 · 大头侧身跑 · 双耳+双眼+粉鼻+身体+短腿·无尾
</p>

</body>
</html>

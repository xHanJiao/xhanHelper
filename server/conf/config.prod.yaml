server:
  port: 8088
  mode: release
  registration_enabled: false
  allowed_users: [your-username]
  memory_auto_extract: true # 恢复 post_chat：抽取段只喂用户消息（挡助手结论幻觉）+ 每批上限 2，见 docs/design/memory-quality/design.md 第四轮
  admin_users:
    - ${XHAN_HELPER_ADMIN}

db:
  host: 127.0.0.1
  database: xhan_helper_cloud
  charset: utf8mb4

llm:
  debug_persist_json: true        # 持久化完整 LLM 请求 JSON 到 DB（异步限频写入，retention_days 走 config.yaml 默认 3 天）

reflection:
  launch_max_iterations: 3
  analyst_max_iterations: 3
  discover_max_iterations: 3
  cluster_threshold: 0.70
  daily_schedules: ["03:00"]
  min_active_days: 3

activity:
  enabled: true
  db_path: data/events.db        # events.db 是自包含 SQLite，与主库 MySQL 无关
  day_timezone: Asia/Shanghai    # 云端主机多为 UTC，显式指定避免派生日期边界错 8 小时
  watermark_mode: segment        # 不依赖客户端时钟，适合服务端/客户端分离

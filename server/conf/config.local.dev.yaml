# 本地 dev 沙盒（Debug 构建；与 prod 完全隔离）
# 用法：APP_ENV=local.dev（见 Makefile 的 `make local-dev`）
# 数据根是 xhanHelper-dev/、端口 18924 —— 与 prod（xhanHelper/、18923）互不干扰。
# 启动断言会校验 local_env / APP_ENV / 数据根 / token 前缀四者配套（见 design.md 第八节）。
#
# 注意：config.local.yaml 只在 APP_ENV=local 时加载，所以本文件要自带全部本地项
# （host / local_single_user / local_token / db.driver 等），不能指望它继承。

server:
  host: 127.0.0.1 # 只监听回环，绝不暴露到局域网
  port: 18924
  mode: debug
  local_env: dev # 本环境标签：与 APP_ENV / 数据根 / token 前缀交叉断言（第 4 期）
  local_single_user: true # 免账号密码：凭 local_token 直接进
  local_token: "${XHAN_LOCAL_TOKEN}" # app 生成随机值经 env 注入；make local-dev 缺省 local-dev-token
  memory_auto_extract: true # 沙盒专用：保留 post_chat 抽取用于调试（三环境现均为 true，值同但用途不同）

db:
  driver: sqlite
  database: "${HOME}/Library/Application Support/xhanHelper-dev/xhan_helper.db"

storage:
  image_dir: "${HOME}/Library/Application Support/xhanHelper-dev/images"

llm:
  debug_persist_json: true # 非本地化项，与 prod 对齐

reflection: # 非本地化项，与 prod 对齐
  launch_max_iterations: 3
  analyst_max_iterations: 3
  discover_max_iterations: 3
  cluster_threshold: 0.70
  daily_schedules: ["03:00"]
  min_active_days: 3

chat:
  session_gap_minutes: 30 # session 间隔阈值（分钟）

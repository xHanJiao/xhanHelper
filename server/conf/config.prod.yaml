server:
  port: 8088
  mode: release
  registration_enabled: true
  allowed_users: [your-username]
  memory_auto_extract: true
  admin_users:
    - ${XHAN_HELPER_ADMIN}

db:
  host: 127.0.0.1
  database: xhan_helper
  charset: utf8mb4


reflection:
  launch_max_iterations: 8
  analyst_max_iterations: 6
  discover_max_iterations: 6
  cluster_threshold: 0.70
  post_chat_delay_seconds: 1800
  daily_schedules: ["03:00"]
  min_active_days: 3
  deliver_interval_minutes: 0        # 关闭 mailbox 投递窗口（省成本），pending findings 积压待恢复后补投
  mission_check_interval_minutes: 0   # 关闭 Mission 定时检查（省成本），手动 /missions/:id/check 不受影响

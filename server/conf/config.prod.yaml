server:
  port: 8088
  mode: release
  registration_enabled: false
  allowed_users: [your-username]
  memory_auto_extract: true
  admin_users:
    - ${XHAN_HELPER_ADMIN}

db:
  host: 127.0.0.1
  database: xhan_helper
  charset: utf8mb4

llm:
  debug_persist_json: true        # 持久化完整 LLM 请求 JSON 到 DB（异步限频写入，retention_days 走 config.yaml 默认 3 天）

reflection:
  launch_max_iterations: 3
  analyst_max_iterations: 3
  discover_max_iterations: 3
  cluster_threshold: 0.70
  daily_schedules: ["03:00"]
  min_active_days: 3

facts:
  enabled: true # 跟随 base（env 未写则沿用 base）

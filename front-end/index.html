<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7EEDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="xhanHelper" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>xhanHelper</title>
    <script>
      (function() {
        var embedded = false;
        try { embedded = !!(window.XH_BRIDGE && window.XH_BRIDGE.platform === 'macOS'); } catch (e) {}
        var theme;
        if (embedded) {
          // 内嵌 WebView：跟随 app 外观（经窗口 effectiveAppearance 传导到媒体查询）
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          var t = localStorage.getItem('xhanhelper_theme');
          if (t != null) {
            theme = t === 'dark' ? 'dark' : 'light';
          } else {
            var h = new Date().getHours();
            theme = (h >= 18 || h < 8) ? 'dark' : 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

# 本地部署（Mac + SQLite + 双击 app 启动）
# 用法：APP_ENV=local（见 Makefile 的 `make local`）
# app 打包后会通过 XHAN_CONF_DIR 指向 Contents/Resources/conf，密钥由 Swift 侧注入

server:
  host: 127.0.0.1 # 只监听回环，绝不暴露到局域网
  port: 18923
  mode: debug
  local_single_user: true # 免账号密码：凭 local_token 直接进
  local_token: "${XHAN_LOCAL_TOKEN}" # app 生成随机值经 env 注入；make local 缺省 local-dev-token
  # 身份锚点是「库里的用户」（迁移进来的 xhan 原样认领），不靠配置里的名字。
  # local_username 可选，仅用于空库新建时的默认名（缺省 "me"）。

db:
  driver: sqlite
  database: "${HOME}/Library/Application Support/xhanHelper/xhan_helper.db"

storage:
  image_dir: "${HOME}/Library/Application Support/xhanHelper/images"

chat:
  session_gap_minutes: 1 # 本地调试：停止聊天 1 分钟后即跑后处理（base 默认 15）

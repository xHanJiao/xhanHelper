server:
  port: 8080
  mode: debug          # debug | release
  registration_enabled: false
  token_ttl_minutes: 2880 # token 过期时间（分钟），心跳续期保持登录态，关闭页面后快速过期
  max_tokens_per_user: 4 # 同一用户最多同时存在的 token 数，超出踢最老的
  agent_route_triggers: [2, 4, 6] # 异步路由触发消息数，空数组=禁用
  memory_auto_extract: false
  disable_background_tasks: false # 禁用所有后台任务（记忆提取/摘要/主题分析/反思等）
  sidecar_url: http://127.0.0.1:9090
  allowed_users:
    - ${ALLOWED_USER}

db:
  driver: mysql         # mysql | sqlite
  host: 127.0.0.1
  port: 3306
  database: xhan_helper
  user: xhan_helper_user
  password: ${XHAN_HELPER_DB_PASSWORD}
  charset: utf8mb4

llm:
  api_key: ${LLM_API_KEY}
  provider: deepseek
  model: deepseek-v4-flash
  strong_model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  default_temperature: 1.0
  default_max_tokens: 30000
  max_iterations: 50
  max_tool_result_chars: -1
  tool_max_concurrency: 2         # 工具并发执行上限，0=不限制
  extract_msg_limit: 50            # 记忆提取每次最多取的消息数
  use_native_fc: true              # 是否使用原生 function calling（默认 true）
  client_tool_timeout_secs: 60     # 客户端工具（Mac 本地 MCP）执行超时秒数，默认 60
  verification:
    enabled: false
    model: flash               # flash | pro，检验用模型
    max_retries: 1             # 最多重检验次数

embedding:
  enable_history_search: false
  api_key: ${EMBEDDING_API_KEY}
  base_url: https://ark.cn-beijing.volces.com
  model: doubao-embedding-vision-251215

snowflake:
  node_id: 1
  datacenter_id: 1

chat:
  history_rounds: 10
  max_summary_rounds: 5       # 单次摘要最多覆盖的 user message 条数，N/2
  max_window_rounds: 200      # 扩张窗口上限轮数
  session_gap_minutes: 15     # session 间隔阈值（分钟），超过则重置窗口
  summary_attach_count: 10          # 摘要附着条数上限
  summary_attach_max_days: 3        # 摘要附着时间窗口（天）
  summary_relevance_threshold: 0.5  # 摘要相关性余弦相似度阈值
  summary_relevance_history_n: 5    # 相关性检查的历史消息窗口大小

share:
  default_valid_days: 7

search:
  provider: bocha
  api_key: ${BOCHA_API_KEY}
  base_url: https://api.bocha.cn/v1
  # 包配额：total_quota 为套餐总次数，quota_expires_at 为到期日
  # used_count 仅首次创建 DB 记录时写入，后续由 DB 自动管理
  total_quota: 1000
  quota_expires_at: "2026-09-01" # TODO: 填写实际到期日
  used_count: 109

retrieval:
  freshness_decay: 0.02           # 时间衰减系数，作为默认值
  memory:
    freshness_decay: 0.01
    threshold: 0.5
    limit: 8
  note:
    freshness_decay: 0
    threshold: 0.5
    limit: 5
  history:
    freshness_decay: 0.008
    threshold: 0.6
    limit: 2

global_default_role:
  system_prompt: |
    你是闲谈伙伴，一个直接真诚、注重事实的聊天对象。
    当用户和你闲聊时，你会认真沟通，分析用户透露的信息，并选择合适的工具记录它们。
    当用户向你征求意见时，你必须先判断用户是否给出了足够用来做判断的信息——不够就追问，补齐再答。
    当用户表达观点时，你必须要求其说明推理链条或信息来源。如果用户无法提供，直接指出；如果用户提供了，检验其逻辑一致性。如果逻辑有漏洞，明确指出来。
    你可以提出自己的看法，但必须说明依据和不确定性。

    ## 核心风格
    - 直接、简洁、追问事实，不替用户脑补
    - 像朋友而非客服，可以指出矛盾，但不越界指导
    - 不渲染情绪，不滥用修辞

    ## 对话节奏——核心：永远不要冷场
    - 每次回复都必须给对方一个能接住的球，不允许以"嗯"、"好的"、"有道理"之类的话结束
    - 球的形式不限于提问，可以是：深挖同一话题、指出矛盾或空白、精炼总结对方的话、给出一个相关事实或数据、抛假设情境
    - 球必须和当前聊的是同一条线，禁止生硬切换到不相关话题（如聊着职业突然问晚饭）
    - 只有用户明确表示"不聊了"、"下次再说"、"就到这吧"等结束信号时，才停止
    - 如果感觉话题快枯竭了，提前换方向，不要等冷场，但换方向时给出过渡（如"话说回来""回到你之前提到的XX"）
    - **⚠️ 关键：如果抛出的球对方没有接（包括：对方跳过没回应、只回了"嗯"/"好的"等敷衍词、表达了明确的负面态度），禁止再次抛出同一方向的问题/话题。立即转入以下之一：换一个相关但不重复的角度、换话题、允许自然结束。同一话题的"深挖"不允许变成同一问题的重复追问。**

    ## 主动发起话题
    - 主动发起话题没有限制，随时可以进行
    - 话题方向：对用户之前聊过的事情做延伸、事实性问题、两难推理、反常识数据、假设性推演
    - 如果用户沉默或回应简短，立刻换一个方向问，不要干等

    ## 禁止
    - 不说教、不灌鸡汤、不评价用户选择
    - 不用修辞手法包装观点（比喻、排比、夸张等），陈述事实即可
    - 不替用户脑补其未提供的信息
    - 不过度结构化（不列清单分要点，除非需要用于拆解逻辑）


server:
  port: 8080
  mode: debug # debug | release
  registration_enabled: false
  token_ttl_minutes: 2880 # token 过期时间（分钟），心跳续期保持登录态，关闭页面后快速过期
  max_tokens_per_user: 8 # 同一用户最多同时存在的 token 数，超出踢最老的；同设备重登只占一个
  memory_auto_extract: false
  # --- 记录循环（记忆两段式：抽取 + 逐候选决策循环）---
  record_loop_max_iterations: 8 # 决策循环轮数上限（含强制收敛轮）；留给「工具打回 + 补检索」余量
  memory_max_per_session: 2 # 单次会话最多新增几条记忆（抽取段上限）。2 = 逼模型只挑最该留的，防一次会话炸出 4~5 条碎片
  memory_neighbor_top_k: 5 # 预检索近邻条数（每域）
  memory_neighbor_threshold: 0.5 # 预检索近邻相似度下限
  memory_confirm_threshold: 0.8 # NONE 时「再次确认」的近邻相似度下限
  memory_topic_reuse_threshold: 0.8 # topic 复用阈值（与 topic-merge 一致）
  memory_extract_temperature: 0 # 抽取段采样温度。抽取要「逐字抄录用户原话」，贪心最稳；只作用于抽取段，其余后台链路走厂商默认。删掉此行即不干预
  profile_startup_migration: false # 启动时异步迁移旧画像（facts 空才迁；迁移完成后可关）
  disable_background_tasks: false # 默认开。env 文件未写则沿用本值；要关就在 conf/config.<env>.yaml 里显式写 true
  sidecar_url: http://127.0.0.1:9090
  allowed_users:
    - ${ALLOWED_USER}

db:
  driver: mysql # mysql | sqlite
  host: 127.0.0.1
  port: 3306
  database: xhan_helper
  user: xhan_helper_user
  password: ${XHAN_HELPER_DB_PASSWORD}
  charset: utf8mb4

llm:
  api_key: ${LLM_API_KEY}
  provider: deepseek # deepseek | ark | doubao
  model: deepseek-flash # V4.1-Flash（原生多模态）；旧名 deepseek-v4-flash 已退役
  strong_model: deepseek-v4-pro # 保持不动：已被上游路由到 V4.1-Flash
  base_url: https://api.deepseek.com
  default_temperature: 1.0
  default_max_tokens: 30000
  context_window: 1000000 # 弱模型（model）上下文窗口 token 上限，用于 UI 展示上下文占用比
  strong_context_window: 1000000 # 强模型（strong_model）上下文窗口 token 上限
  max_iterations: 80
  max_tool_result_chars: 20000 # 历史回放时工具结果的截断阈值（字符）；仅作用于历史重放，当前轮不截。20000 与客户端注入预算 clientToolInjectBudgetBytes 对齐，只兜住病态超大结果
  tool_max_concurrency: 2 # 工具并发执行上限，0=不限制
  extract_msg_limit: 50 # 记忆提取每次最多取的消息数
  client_tool_timeout_secs: 240 # 客户端工具执行超时秒数（默认 240：覆盖 L3 审批队首 180s + 执行余量），
  debug_persist_json: false # 是否持久化完整 LLM 请求 JSON 到 DB（异步限频写入，prod 可开启，配 debug_json 控制频率与保留）
  debug_json:
    retention_days: 3 # request_json 保留天数，超出后定时清理
    flush_interval_ms: 1000 # 异步刷盘间隔毫秒
    max_bytes_per_flush: 2097152 # 每批字节预算（2MB/批，限频核心，实测吞吐 ~111MB/s 的 ~2%）
    max_payload_bytes: 1048576 # 单条 payload 上限，超限丢弃（1MB）
    queue_max_entries: 2048 # 排队条数上限
    queue_max_bytes: 67108864 # 排队字节上限（64MB，防 2G 内存被打爆）
    cleanup_interval_hours: 6 # 保留清理周期
    cleanup_batch_rows: 500 # 清理每批行数
    extra_trace_retention_days: 14 # message.extra 检索 trace（providers 等）保留天数；<=0 关闭。独立于 debug_persist_json
  verification:
    enabled: false
    model: flash # flash | pro，检验用模型
    max_retries: 1 # 最多重检验次数

# 后台任务专用 LLM（记忆提取/摘要/画像/主题/反思/任务/提醒等异步链路）。
# model 留空 = 未启用，自动复用上方 llm 配置（行为与以前完全一致）。
# 启用后：在线聊天仍走 llm，所有后台 LLM 调用走此供应商。
llm_bg:
  api_key: ${LLM_API_KEY} # 复用主 key；如需后台独立额度/计费，可改用 ${LLM_BG_API_KEY} 并在环境变量注入
  provider: deepseek # 原厂 DeepSeek，OpenAI 兼容协议
  model: deepseek-flash # V4.1-Flash（原生多模态）；旧名 deepseek-v4-flash 已退役
  strong_model: deepseek-v4-pro # 保持不动：已被上游路由到 V4.1-Flash
  base_url: https://api.deepseek.com
  http_timeout_secs: 120
  strong_http_timeout_secs: 600

embedding:
  api_key: ${EMBEDDING_API_KEY}
  base_url: https://ark.cn-beijing.volces.com
  model: doubao-embedding-vision-251215

snowflake:
  node_id: 1
  datacenter_id: 1

chat:
  history_rounds: 10
  recent_user_msgs: 3 # 新窗口注入资源区的最近轮数（user + 非 tool call 的 AI 最终回复，不重放完整轮）
  max_summary_rounds: 5 # 单次摘要最多覆盖的 user message 条数，N/2, 目前无用
  max_window_rounds: 800 # 扩张窗口上限轮数（agent 复杂任务需要长上下文；缓存命中后成本可控）
  session_gap_minutes: 30 # session 间隔阈值（分钟），超过则重置窗口并触发 session_end 提取
  summary_attach_count: 1 # 摘要附着条数上限
  summary_attach_max_days: 3 # 摘要附着时间窗口（天）
  summary_relevance_threshold: 0.5 # 摘要相关性余弦相似度阈值
  summary_relevance_history_n: 5 # 相关性检查的历史消息窗口大小
  summary_dedup_threshold: 0.85 # 摘要附着去重阈值（相邻摘要更相似则丢弃较旧者）
  subagent_only_client_tools: [fs, shell] # work 模式下对主循环隐藏的客户端工具组。注意 shell_peek（只读探查）不在此列 → 主循环可直接调用，见 docs/design/shell-tool/readonly-free-and-peek.md；browser 已放回主循环（主会话可直接接管用户打开的页），见 docs/design/mac-apps/browser-main-session.md；plan 模式固定放行 fs 的 glob/grep/read（服务端白名单，不受此开关影响）
  image_replay_rounds: 10 # 历史消息重放图片的最近轮数（图片 token 不复用文本缓存，全量重放每轮都烧钱）
  # 对 LLM 隐藏的工具组。note 已由右栏「灵阅」替代，且 Mac 端不再有笔记面板——
  # 留着它会出现「写了看不见」（docs/design/html-artifact/design.md §9.5）。
  tool_excludes: [note]

archive:
  after_days: 14 # 会话无活动超过 N 天自动归档（is_deleted=true，可从设置页找回）；<=0 关闭
  interval_minutes: 1440 # 归档扫描间隔（分钟），默认每日一次

vector:
  message_retention_days: 14 # message 向量保留天数，超出则内存逐出 + DB 行删除；<=0 关闭
  summary_retention_days: 30 # summary 向量保留天数，同上；<=0 关闭
  evict_interval_hours: 24 # 逐出扫描间隔（小时）
  vacuum_free_threshold_mb: 64 # 删行后空闲页超此 MB 才执行 VACUUM 回收文件空间；<=0 关闭
  chunk_disabled_parents: [memory, note, summary] # 短文本只用 full 向量，不建 chunk（文档仍建）

activity:
  enabled: true # 活动埋点总开关。主库为 sqlite 时 events.db 与主库同目录；主库为 MySQL（dev/prod）须配 db_path，否则启动 fatal
  watermark_mode: time # 上传接口水位口径：time=本批最大 occurred_at（默认，需两端同钟）；segment=回显 segment_id（逐段确认，端分离时切换）

storage:
  image_dir: data/images # 图床根目录（文档配图 + 聊天图片输入共用）
  max_image_bytes: 33554432 # 单图大小上限 32 MiB（对齐 DeepSeek 单图上限）
  image_ttl_days: 15 # 被消息引用过的图保留天数；<0 关闭该类过期清理（文件缺失自愈恒开）
  image_orphan_ttl_days: 3 # 从未被引用的图保留天数；<0 关闭该类过期清理（文件缺失自愈恒开）
  image_cleanup_interval_minutes: 720 # 清理扫描间隔（分钟），默认 12 小时

# 本地数据备份（仅本地模式生效；dest/enabled 由 Swift 设置页经 env 注入，见 local-backup 设计）
backup:
  enabled: false # 总开关（默认关）
  dest: "" # 备份目标目录（可为 iCloud Drive 路径）
  interval_days: 1 # 备份间隔天数
  daily_keep: 3 # 保留最近几次
  weekly_keep: 1 # 额外保留几份「≥7 天前」的

# 联网工具（DeepSeek 官方 Search / Fetch，见 docs/design/web-tools/design.md）
web_tools:
  enabled: true # 注册 web 工具组（搜索 + 抓取），主循环经 expose_tools 按需暴露
  api_key: "" # 空则回退 llm.api_key；非 deepseek provider 需单独配
  base_url: https://api.deepseek.com
  timeout_seconds: 30
  search_count: 8 # 模型不传 count 时的条数；模型传值夹在 1..20
  max_content_chars: 8000 # fetch 正文 / search 单条正文上限（字符），须 ≤ llm.max_tool_result_chars
  search_max_chars: 16000 # search 结果总预算（字符），超出会截条并在返回的 note 里说明
  daily_limit: 1000 # 每日 search+fetch 合计上限；<0 不限制。按请求预扣，失败也占额度

subagent:
  explore_max_iterations: 10 # 防死循环兜底（timeout 才是真实预算）；调太多轮转不完
  explore_timeout_seconds: 600
  user_context_enabled: true # 向主 LLM 注入 user_context 子任务触发规则（纯 prompt 引导的成本保险丝）；默认关闭

retrieval:
  freshness_decay: 0.02 # 时间衰减系数，作为默认值
  memory:
    freshness_decay: 0.01
    threshold: 0.5
    limit: 8
  note:
    freshness_decay: 0
    threshold: 0.5
    limit: 5
  history:
    freshness_decay: 0.008
    threshold: 0.6
    limit: 2
  # 事件注入：全量列表 + 命中附记忆（见 docs/design/event-threads/injection-rewrite.md）
  event:
    freshness_decay: 0.01
    threshold: 0.5
    limit: 20 # 记忆召回乘数（chunk=limit*8 / 全量=limit*2），不是事件条数上限
  # 公共资源区：历史消息不再重放检索注入，资源收敛到最新消息（phase-10 任务 B）
  resource_zone:
    enabled: true
    budget_chars: 24000 # 总预算帽（UTF-8 字符数，中文 1 字=1）
    budget_profile: 1600 # profile 预算（稳定画像层）
    budget_summary: 500 # summary 预算
    budget_memory: 3000 # memory 预算（只放未聚合的普通记忆）
    budget_note: 0 # note 预算（笔记不再注入资源区）
    budget_event: 18000 # 事件区预算（全量列表 + 命中附记忆）
    quota_summary: 1 # 摘要配额
    quota_memory: 6 # 记忆配额
    quota_note: 0 # 笔记配额（0 = 不注入）
    quota_event_pinned: 3 # event.enable 关注上限（full + 最近 20 条记忆）
    quota_event_hit: 3 # 命中事件上限（hit + 命中记忆 top 10）
    event_memories: 20 # pinned 每事件附带记忆条数（updated_at DESC）
    event_hit_memories: 10 # 命中事件附带记忆条数（按命中分数）
    event_recent_memories: 3 # 最近窗口事件附带记忆条数
    event_recent_window_days: 14 # 摘要窗口：last_memory_at 在 N 天内放 summary，否则 index

# session 结束后的记忆 → 事件拼装（docs/design/event-threads）
event_assembly:
  candidate_top: 10 # 注入给拼装的候选事件数
  dedupe_sim: 0.88 # 新建事件前与现有 summary 的余弦上限（防重复建）
  max_iterations: 6 # ReAct 总轮数（含强制收敛轮）
  batch_size: 40 # 单批新记忆条数；超出分批但仍全部处理

# 语音聊天（豆包 TTS + 流式 ASR）。详见 docs/design/voice-chat/design.md。
# 新版火山控制台只需要 API Key；开通「豆包语音合成模型2.0」和「豆包流式语音识别模型2.0」。
voice:
  enabled: false # base 默认关：fail-fast 只在显式开启的环境生效（dev/prod 各自打开）
  api_key: ${DOUBAO_VOICE_API_KEY}
  tts:
    endpoint: https://openspeech.bytedance.com/api/v3/tts/unidirectional
    resource_id: seed-tts-2.0
    speaker: zh_female_vv_uranus_bigtts # 默认音色（客户端未选择时使用）；Vivi 2.0
    format: mp3
    sample_rate: 24000
    speech_rate: 0
    max_chars: 2000
    timeout_seconds: 90
  asr:
    endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async
    resource_id: volc.seedasr.sauc.duration # 小时版；单用户不要选并发版
    language: zh-CN
    max_seconds: 60 # A 模式单轮上限
    session_seconds: 600 # C 模式（连续对话）单次会话上限；按音频时长计费，静音也计时
    result_type: full # A 模式；C 模式由服务端强制 single
    end_window_size: 800 # 静音判停阈值 ms（范围 300-5000）
    timeout_seconds: 30

global_default_role:
  system_prompt: |
    你是闲谈伙伴，一个直接真诚、注重事实的聊天对象。
    当用户和你闲聊时，你会认真沟通，分析用户透露的信息，并选择合适的工具记录它们。
    当用户向你征求意见时，你必须先判断用户是否给出了足够用来做判断的信息——不够就追问，补齐再答。
    当用户表达观点时，你必须要求其说明推理链条或信息来源。如果用户无法提供，直接指出；如果用户提供了，检验其逻辑一致性。如果逻辑有漏洞，明确指出来。
    你可以提出自己的看法，但必须说明依据和不确定性。

    ## 核心风格
    - 像朋友而非客服，可以指出矛盾，但不越界指导
    - 不渲染情绪，不滥用修辞

    ## 禁止
    - 不说教、不灌鸡汤、不评价用户选择
    - 不用修辞手法包装观点（比喻、排比、夸张等），陈述事实即可
    - 不替用户脑补其未提供的信息
    - 不过度结构化（不列清单分要点，除非需要用于拆解逻辑）

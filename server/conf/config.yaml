server:
  port: 8080
  mode: debug          # debug | release
  registration_enabled: false
  token_ttl_hours: 720 # token 过期时间（小时），默认 720h = 30 天
  max_tokens_per_user: 4 # 同一用户最多同时存在的 token 数，超出踢最老的
  agent_route_triggers: [2, 4, 6] # 异步路由触发消息数，空数组=禁用
  memory_auto_extract: false
  sidecar_url: http://127.0.0.1:9090
  allowed_users:
    - ${ALLOWED_USER}

db:
  driver: mysql         # mysql | sqlite
  host: 127.0.0.1
  port: 3306
  database: xhan_helper
  user: xhan_helper_user
  password: ${XHAN_HELPER_DB_PASSWORD}
  charset: utf8mb4

llm:
  # provider: doubao
  # api_key: ${LLM_API_KEY}
  # model: doubao-seed-1-8-251228
  # base_url: https://ark.cn-beijing.volces.com/api/v3

# llm:
  api_key: ${LLM_API_KEY}
  provider: deepseek
  model: deepseek-v4-flash
  strong_model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  default_temperature: 1.0
  default_max_tokens: 30000
  max_iterations: 20

embedding:
  enable_history_search: false
  api_key: ${EMBEDDING_API_KEY}
  base_url: https://ark.cn-beijing.volces.com
  model: doubao-embedding-vision-251215

snowflake:
  node_id: 1
  datacenter_id: 1

retrieval:
  freshness_decay: 0.02           # 时间衰减系数，作为默认值
  memory:
    vector_weight: 0.5
    keyword_weight: 0.3
    freshness_weight: 0.2
    freshness_decay: 0.01
    threshold: 0.5
    limit: 8
  note:
    vector_weight: 0.5
    keyword_weight: 0.3
    freshness_weight: 0.0
    freshness_decay: 0
    threshold: 0.5
    limit: 5
  history:
    vector_weight: 0.6
    keyword_weight: 0.3
    freshness_weight: 0.1
    freshness_decay: 0.005
    threshold: 0.8
    limit: 5

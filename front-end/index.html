<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xhanHelper</title>
    <script>
      (function() {
        var t = localStorage.getItem('xhanhelper_theme');
        if (t != null) {
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } else {
          var h = new Date().getHours();
          document.documentElement.setAttribute('data-theme', (h >= 18 || h < 8) ? 'dark' : 'light');
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

server:
  mode: debug
  registration_enabled: true
  disable_background_tasks: false # 开启后台任务（会话后处理/归档/反思等）
  memory_auto_extract: true
  max_tokens_per_user: 4
  admin_users:
    - 11111111-1111-4111-8111-111111111111
    - 22222222-2222-4222-8222-222222222222
    - 33333333-3333-4333-8333-333333333333
  # allowed_users:
  #   - your-username

db:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  user: xhan
  password: ${XHAN_HELPER_DB_PASSWORD}
  database: xhan_helper_test

activity:
  enabled: true
  db_path: data/events.db        # dev 主库是 MySQL，events.db 需显式指定（否则启动 fatal）
  day_timezone: Asia/Shanghai
  watermark_mode: segment

llm:
  max_iterations: 20
  debug_persist_json: true # 是否持久化完整 LLM 请求 JSON 到 DB（异步限频写入，prod 可开启，配 debug_json 控制频率与保留）

embedding:
  api_key: ${EMBEDDING_API_KEY}
  base_url: https://ark.cn-beijing.volces.com
  model: doubao-embedding-vision-251215

chat:
  session_gap_minutes: 30      # session 间隔阈值（分钟）

subagent:
  explore_max_iterations: 3 # dev 测试：调小轮数便于触发预算耗尽/超时，验证 task_id 续跑
  user_context_enabled: true # 与 base config.yaml 一致

reflection:
  launch_max_iterations: 8
  analyst_max_iterations: 6
  discover_max_iterations: 6
  cluster_threshold: 0.70
  daily_schedules: ["03:00"]
  min_active_days: 3

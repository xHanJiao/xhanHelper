server:
  port: 8080
  mode: debug          # debug | release
  registration_enabled: false
  token_ttl_hours: 720 # token 过期时间（小时），默认 720h = 30 天
  max_tokens_per_user: 4 # 同一用户最多同时存在的 token 数，超出踢最老的
  agent_route_triggers: [2, 4, 6] # 异步路由触发消息数，空数组=禁用
  memory_auto_extract: false
  sidecar_url: http://127.0.0.1:9090
  allowed_users:
    - ${ALLOWED_USER}

db:
  driver: mysql         # mysql | sqlite
  host: 127.0.0.1
  port: 3306
  database: xhan_helper
  user: xhan_helper_user
  password: ${XHAN_HELPER_DB_PASSWORD}
  charset: utf8mb4

llm:
  # provider: doubao
  # api_key: ${LLM_API_KEY}
  # model: doubao-seed-1-8-251228
  # base_url: https://ark.cn-beijing.volces.com/api/v3

# llm:
  api_key: ${LLM_API_KEY}
  provider: deepseek
  model: deepseek-v4-flash
  strong_model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  default_temperature: 1.0
  default_max_tokens: 30000
  max_iterations: 20
  max_tool_result_chars: 2000
  tool_max_concurrency: 2         # 工具并发执行上限，0=不限制
  extract_msg_limit: 50            # 记忆提取每次最多取的消息数
  use_native_fc: true              # 是否使用原生 function calling（默认 true）
  verification:
    enabled: true
    model: flash               # flash | pro，检验用模型
    max_retries: 1             # 最多重检验次数

embedding:
  enable_history_search: false
  api_key: ${EMBEDDING_API_KEY}
  base_url: https://ark.cn-beijing.volces.com
  model: doubao-embedding-vision-251215

snowflake:
  node_id: 1
  datacenter_id: 1

chat:
  history_rounds: 10

share:
  default_valid_days: 7

search:
  provider: bocha
  api_key: ${BOCHA_API_KEY}
  base_url: https://api.bocha.cn/v1
  # 包配额：total_quota 为套餐总次数，quota_expires_at 为到期日
  # used_count 仅首次创建 DB 记录时写入，后续由 DB 自动管理
  total_quota: 1000
  quota_expires_at: "2026-09-01" # TODO: 填写实际到期日
  used_count: 109

retrieval:
  freshness_decay: 0.02           # 时间衰减系数，作为默认值
  memory:
    freshness_decay: 0.01
    threshold: 0.5
    limit: 8
  note:
    freshness_decay: 0
    threshold: 0.5
    limit: 5
  history:
    freshness_decay: 0.008
    threshold: 0.6
    limit: 2
